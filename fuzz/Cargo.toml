[package]
name = "shpool-vterm-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
shpool-vterm = { path = ".." }

[[bin]]
name = "restore"
path = "fuzz_targets/restore.rs"
test = false
doc = false
bench = false
